// DFSha - Contrato gRPC v1.1
//
// Reglas del contrato:
//   * v1.1 solo AGREGA mensajes, campos y rpc (no se renumera ni se cambia el tipo de nada de v1).
//   * Los mensajes marcados "RabbitMQ" no son rpc: se serializan con toByteArray() y viajan por el
//     exchange dfsha.events.
syntax = "proto3";

package dfsha.v1;
option java_multiple_files = true;
option java_package = "co.eafit.dfsha.grpc.v1";

message Empty {}
message Status { bool ok = 1; string code = 2; string message = 3; }

// ---------------------------------------------------------------- usuarios
message LoginRequest { string username = 1; string password = 2; }
message LoginResponse { string access_token = 1; int64 expires_at_epoch_seconds = 2; string user_id = 3; }

// ---------------------------------------------------------------- archivos
// v1.2: reemplazo copy-on-write condicionado a version y lease. Vacio conserva put v1.1.
message AllocateFileRequest {
  string path = 1; int64 file_size_bytes = 2; string operation_id = 3;
  string replaces_file_id = 4; string lock_token = 5;
}
message FileRef { string file_id = 1; string path = 2; }

// v1.1: una copia de un bloque. El manifiesto trae todas las copias para leer con failover.
message BlockLocation {
  string datanode_id = 1;
  string datanode_endpoint = 2;
  string read_token = 3;
  int64 token_expires_at_epoch_seconds = 4;
}

message BlockPlan {
  string block_id = 1;
  int32 block_index = 2;
  int64 offset_bytes = 3;
  int64 size_bytes = 4;
  string datanode_id = 5;            // subida: DataNode primario. Descarga: la primera copia.
  string datanode_endpoint = 6;
  string write_token = 7;            // solo en AllocateFile
  string read_token = 8;
  string checksum_sha256 = 9;        // solo en GetFileManifest
  int64 token_expires_at_epoch_seconds = 10;
  repeated BlockLocation replicas = 11;   // v1.1: todas las copias vivas, la menos cargada primero
}
message AllocateFileResponse { FileRef file = 1; int64 block_size_bytes = 2; repeated BlockPlan blocks = 3; }
message CommitFileRequest { string file_id = 1; string operation_id = 2; }
message CommitFileResponse { Status status = 1; repeated string missing_block_ids = 2; }
message FileManifest { FileRef file = 1; int64 file_size_bytes = 2; repeated BlockPlan blocks = 3; }
message PathRequest { string path = 1; bool recursive = 2; }
message DirectoryEntry { string path = 1; bool directory = 2; int64 size_bytes = 3; }
message ListResponse { repeated DirectoryEntry entries = 1; }

// v1.1: lock() exclusivo con expiración
message LockRequest { string path = 1; int32 ttl_seconds = 2; }
message LockResponse { Status status = 1; string lock_id = 2; int64 expires_at_epoch_seconds = 3; }
message LockRef { string lock_id = 1; }

// ---------------------------------------------------------------- bloques (DataNode)
message WriteBlockHeader { string block_id = 1; string file_id = 2; string write_token = 3; int64 expected_size_bytes = 4; }
message BlockChunk { oneof payload { WriteBlockHeader header = 1; bytes data = 2; } }
message BlockWriteResponse { Status status = 1; string block_id = 2; int64 bytes_written = 3; string checksum_sha256 = 4; }
message ReadBlockRequest { string block_id = 1; string read_token = 2; int64 offset_bytes = 3; int64 length_bytes = 4; }
message DataChunk { bytes data = 1; int64 offset_bytes = 2; bool last = 3; }
message DeleteBlockRequest { string block_id = 1; string delete_token = 2; }

// ---------------------------------------------------------------- registro de DataNodes
message RegisterDataNodeRequest {
  string node_name = 1;
  string advertised_endpoint = 2;    // el que usan los clientes
  string internal_endpoint = 3;      // el que usan los otros nodos (copia de réplicas)
  int64 capacity_bytes = 4;
  string registration_key = 5;       // v1.1: clave secreta del clúster
}
message RegisterDataNodeResponse { Status status = 1; string datanode_id = 2; string node_token = 3; }
message ReportBlockStoredRequest { string datanode_id = 1; string node_token = 2; string block_id = 3; int64 bytes_written = 4; string checksum_sha256 = 5; }

// RabbitMQ (routing key heartbeat.<datanode_id>): el DataNode lo publica cada 5 s.
message Heartbeat { string datanode_id = 1; string node_token = 2; int64 capacity_bytes = 3; int64 free_bytes = 4; int32 active_transfers = 5; int64 stored_blocks = 6; }

// v1.1 RabbitMQ (routing key replication.<datanode_destino>): "copia este bloque desde el origen".
message ReplicationTask {
  string block_id = 1;
  string source_datanode_id = 2;
  string source_endpoint = 3;        // internal_endpoint del DataNode que ya tiene el bloque
  string target_datanode_id = 4;
  string checksum_sha256 = 5;
  int64 size_bytes = 6;
  string read_token = 7;             // para poder hacer ReadBlock en el origen
}

// v1.1 RabbitMQ (routing key delete.<datanode_id>): "borra este bloque de tu disco".
message BlockDeleteTask { string block_id = 1; }

// ---------------------------------------------------------------- servicios
service ControlService {
  rpc Register(LoginRequest) returns (Status);                 // v1.1: crear usuario
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc AllocateFile(AllocateFileRequest) returns (AllocateFileResponse);
  rpc CommitFile(CommitFileRequest) returns (CommitFileResponse);
  rpc GetFileManifest(FileRef) returns (FileManifest);
  rpc ListDirectory(PathRequest) returns (ListResponse);
  rpc CreateDirectory(PathRequest) returns (Status);
  rpc DeletePath(PathRequest) returns (Status);                // rm y rmdir
  rpc AcquireLock(LockRequest) returns (LockResponse);         // v1.1
  rpc ReleaseLock(LockRef) returns (Status);                   // v1.1
}
service DataNodeService {
  rpc WriteBlock(stream BlockChunk) returns (BlockWriteResponse);
  rpc ReadBlock(ReadBlockRequest) returns (stream DataChunk);
  rpc DeleteBlock(DeleteBlockRequest) returns (Status);
}
service NodeRegistryService {
  rpc RegisterDataNode(RegisterDataNodeRequest) returns (RegisterDataNodeResponse);
  rpc ReportBlockStored(ReportBlockStoredRequest) returns (Status);
}
