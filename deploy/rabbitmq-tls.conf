listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /run/secrets/tls_ca
ssl_options.certfile = /run/secrets/tls_cert
ssl_options.keyfile = /run/secrets/tls_key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
# Autenticacion AMQP por usuario/clave sobre TLS; servidor verificado por CA y hostname en Java.
