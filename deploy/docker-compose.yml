# DFSha - clúster completo con alta disponibilidad (desde la carpeta deploy/):
#
#   bash gen-secrets.sh                  una sola vez: contraseñas, claves y certificados TLS
#   docker compose up -d --build         levantar todo
#   docker compose ps                    ver el estado
#   docker compose logs -f controlnode1  ver los logs de un nodo
#   docker compose down                  apagar (con -v además borra todos los datos)
#
# Qué levanta: PostgreSQL primario + standby, RabbitMQ, 2 ControlNodes activos y 4 DataNodes.
name: dfsha

# --------------------------------------------------------------------------- plantillas
x-app: &app
  image: dfsha-app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  networks: [dfsha_net]

# Variables comunes a todos los nodos Java
x-node-env: &node-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: dfsha
  RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
  REGISTRATION_KEY_FILE: /run/secrets/cluster_registration_key
  TOKEN_PUBLIC_KEY_FILE: /run/secrets/token_public_key
  # TLS en gRPC: certificado y llave de este nodo, y la CA para verificar a los demás
  TLS_CERT_FILE: /run/secrets/tls_cert
  TLS_KEY_FILE: /run/secrets/tls_key
  TLS_CA_FILE: /run/secrets/tls_ca

x-controlnode: &controlnode
  <<: *app
  command: ["java", "-jar", "/app/dfsha-controlnode.jar"]
  environment:
    <<: *node-env
    GRPC_PORT: "50051"
    # Los dos PostgreSQL: el driver se conecta al que esté de primario (failover sin reiniciar)
    DB_URL: jdbc:postgresql://postgres:5432,postgres-standby:5432/dfsha?targetServerType=primary
    DB_USER: dfsha
    DB_PASSWORD_FILE: /run/secrets/postgres_password
    TOKEN_PRIVATE_KEY_FILE: /run/secrets/token_private_key
    BLOCK_SIZE_BYTES: ${BLOCK_SIZE_BYTES:-8388608}           # 8 MiB
    REPLICATION_FACTOR: ${REPLICATION_FACTOR:-3}
    DELETE_RETRY_SECONDS: ${DELETE_RETRY_SECONDS:-10}
    RESERVED_BYTES: "268435456"                              # 256 MiB por nodo que nunca se asignan
    SUSPECT_AFTER_SECONDS: "15"
    DEAD_AFTER_SECONDS: "30"
  secrets: [rabbitmq_password, cluster_registration_key, token_public_key, tls_cert, tls_key, tls_ca,
            postgres_password, token_private_key]
  depends_on:
    postgres: { condition: service_healthy }
    postgres-standby: { condition: service_started }
    rabbitmq: { condition: service_healthy }
  healthcheck:
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/50051'"]
    interval: 5s
    timeout: 3s
    retries: 20

x-datanode-env: &datanode-env
  <<: *node-env
  CONTROLNODE_ENDPOINTS: controlnode1:50051,controlnode2:50051
  STORAGE_PATH: /data/blocks
  STORAGE_KEY_FILE: /run/secrets/storage_key                # AES-256 del cifrado en reposo
  DATANODE_CAPACITY_BYTES: ${DATANODE_CAPACITY_BYTES:-5368709120}   # 5 GiB simulados

x-datanode: &datanode
  <<: *app
  command: ["java", "-jar", "/app/dfsha-datanode.jar"]
  secrets: [rabbitmq_password, cluster_registration_key, token_public_key, tls_cert, tls_key, tls_ca, storage_key]
  depends_on:
    controlnode1: { condition: service_healthy }

# --------------------------------------------------------------------------- servicios
services:
  postgres:
    image: postgres:16-alpine
    networks: [dfsha_net]
    environment:
      POSTGRES_DB: dfsha
      POSTGRES_USER: dfsha
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./migrations/001-block-delete-outbox.sql:/docker-entrypoint-initdb.d/01a-delete-outbox.sql:ro
      - ./postgres/init-replication.sh:/docker-entrypoint-initdb.d/02-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfsha -d dfsha"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-standby:
    image: postgres:16-alpine
    user: postgres
    networks: [dfsha_net]
    entrypoint: ["sh", "/scripts/standby.sh"]
    secrets: [postgres_password]
    volumes:
      - postgres_standby_data:/var/lib/postgresql/data
      - ./postgres:/scripts:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfsha -d dfsha"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq                 # RabbitMQ guarda sus datos según el hostname
    networks: [dfsha_net]
    environment:
      RABBITMQ_DEFAULT_USER: dfsha
    entrypoint:
      - /bin/sh
      - -c
      - export RABBITMQ_DEFAULT_PASS="$$(cat /run/secrets/rabbitmq_password)" && exec docker-entrypoint.sh rabbitmq-server
    secrets: [rabbitmq_password]
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:15672:15672"        # consola web: http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Dos ControlNodes activos a la vez (no guardan estado: todo está en PostgreSQL).
  controlnode1:
    <<: *controlnode
    ports: ["50051:50051"]

  controlnode2:
    <<: *controlnode
    ports: ["50052:50051"]

  # ADVERTISED_ENDPOINT es la dirección que reciben los clientes. En AWS/GCP define
  # ADVERTISE_HOST en .env con la IP pública o el DNS de la VM.
  datanode1:
    <<: *datanode
    environment:
      <<: *datanode-env
      NODE_NAME: datanode1
      GRPC_PORT: "50061"
      ADVERTISED_ENDPOINT: ${ADVERTISE_HOST:-localhost}:50061
      INTERNAL_ENDPOINT: datanode1:50061
    ports: ["50061:50061"]
    volumes: [datanode1_data:/data/blocks]

  datanode2:
    <<: *datanode
    environment:
      <<: *datanode-env
      NODE_NAME: datanode2
      GRPC_PORT: "50062"
      ADVERTISED_ENDPOINT: ${ADVERTISE_HOST:-localhost}:50062
      INTERNAL_ENDPOINT: datanode2:50062
    ports: ["50062:50062"]
    volumes: [datanode2_data:/data/blocks]

  datanode3:
    <<: *datanode
    environment:
      <<: *datanode-env
      NODE_NAME: datanode3
      GRPC_PORT: "50063"
      ADVERTISED_ENDPOINT: ${ADVERTISE_HOST:-localhost}:50063
      INTERNAL_ENDPOINT: datanode3:50063
    ports: ["50063:50063"]
    volumes: [datanode3_data:/data/blocks]

  datanode4:
    <<: *datanode
    environment:
      <<: *datanode-env
      NODE_NAME: datanode4
      GRPC_PORT: "50064"
      ADVERTISED_ENDPOINT: ${ADVERTISE_HOST:-localhost}:50064
      INTERNAL_ENDPOINT: datanode4:50064
    ports: ["50064:50064"]
    volumes: [datanode4_data:/data/blocks]

networks:
  dfsha_net:

# Los archivos los crea gen-secrets.sh y no van a Git.
secrets:
  postgres_password:        { file: ./secrets/postgres_password.txt }
  rabbitmq_password:        { file: ./secrets/rabbitmq_password.txt }
  cluster_registration_key: { file: ./secrets/cluster_registration_key.txt }
  storage_key:              { file: ./secrets/storage_key.txt }
  token_private_key:        { file: ./secrets/token_private.pem }
  token_public_key:         { file: ./secrets/token_public.pem }
  tls_ca:                   { file: ./secrets/ca.crt }
  tls_cert:                 { file: ./secrets/node.crt }
  tls_key:                  { file: ./secrets/node.key }

volumes:
  postgres_data:
  postgres_standby_data:
  rabbitmq_data:
  datanode1_data:
  datanode2_data:
  datanode3_data:
  datanode4_data:
