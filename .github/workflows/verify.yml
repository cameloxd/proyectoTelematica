name: Compilar y probar con PostgreSQL
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dfsha_test
          POSTGRES_USER: dfsha_test
          POSTGRES_PASSWORD: test-only-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dfsha_test -d dfsha_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DFSHA_TEST_DB_URL: jdbc:postgresql://localhost:5432/dfsha_test
      DFSHA_TEST_DB_USER: dfsha_test
      DFSHA_TEST_DB_PASSWORD: test-only-ci-password
      BLOCK_SIZE_BYTES: '8388608'
      RESERVED_BYTES: '0'
      MAX_TRANSFERS_PER_NODE: '8'
      TARGET_BLOCKS_PER_NODE: '1000'
      REPLICATION_FACTOR: '3'
      TLS_CA_FILE: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Regenerar contrato, compilar y ejecutar pruebas
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Rechazar omisiones, fallos o ausencia de pruebas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports = list(Path('.').glob('dfsha-*/target/surefire-reports/TEST-*.xml'))
          assert reports, 'No hay reportes JUnit'
          suites = [ET.parse(p).getroot() for p in reports]
          for s in suites:
              assert all(int(s.get(k, 0)) == 0 for k in ('failures', 'errors', 'skipped')), s.attrib
          total = sum(int(s.get('tests', 0)) for s in suites)
          assert total >= 89, f'Bateria incompleta: {total}'
          print(f'{total} pruebas aprobadas sin omisiones')
          PY
      - name: Conservar reportes incluso si falla la compilacion
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-java17-postgres16
          path: '**/target/surefire-reports/'
          if-no-files-found: warn
